name: Release skill package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist build/xitongguihua-di2ban-jiaocai
          rsync -a --exclude ".git" --exclude ".github" \
            --exclude "dist" --exclude "build" \
            --exclude "系规考前手册_打印版.pdf" ./ build/xitongguihua-di2ban-jiaocai/
          (cd build && zip -qr "../dist/xitongguihua-di2ban-jiaocai-${VERSION}.zip" xitongguihua-di2ban-jiaocai)
          cp "dist/xitongguihua-di2ban-jiaocai-${VERSION}.zip" \
             "dist/xitongguihua-di2ban-jiaocai-${VERSION}.skill"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skill-packages
          path: dist/*

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
